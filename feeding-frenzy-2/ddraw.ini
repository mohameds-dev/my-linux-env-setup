; cnc-ddraw configuration for Feeding Frenzy 2 on Linux Mint
; Optimized for silky smooth 60 FPS, proper 4:3 aspect ratio, borderless fullscreen, and OpenGL rendering

[ddraw]
; Borderless fullscreen: fills the screen without switching physical X11 monitor resolution
fullscreen=true
windowed=true
border=false

; Resolution (0 = match monitor native resolution while maintaining aspect ratio)
width=0
height=0

; Aspect ratio preservation:
; maintas=true fills 100% of the screen height proportionally, leaving gaps ONLY on left/right (4:3 pillarbox)
; boxing=false disables integer scaling so top and bottom gaps are completely eliminated
maintas=true
boxing=false

; Frame rate & VSync
vsync=true
maxfps=60
adjrefreshrate=false

; Modern OpenGL renderer for Wine on Linux
renderer=opengl

; Window & input capture
nonexclusive=true
capture=true

; Scaling filter (clean pixel art rendering)
shader=
filter=nearest
